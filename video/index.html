<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      body { font-family: "Inter", sans-serif; }
      code, pre, .monospace { font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body>
    <!-- Portfolio reel: four pieces sequenced back-to-back. Scrub the timeline to
         review each. Every piece is a standalone sub-composition in compositions/. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="108"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="mtop"
        data-composition-id="mtop"
        data-composition-src="compositions/mtop.html"
        class="clip"
        data-start="0"
        data-duration="15"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="teaser"
        data-composition-id="teaser"
        data-composition-src="compositions/teaser.html"
        class="clip"
        data-start="15"
        data-duration="18"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="proof-reel"
        data-composition-id="proof-reel"
        data-composition-src="compositions/proof-reel.html"
        class="clip"
        data-start="33"
        data-duration="30"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="seerlens"
        data-composition-id="seerlens"
        data-composition-src="compositions/seerlens.html"
        class="clip"
        data-start="63"
        data-duration="45"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Host timeline is empty — HyperFrames drives each sub-composition independently.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
