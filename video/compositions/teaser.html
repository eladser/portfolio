<script>

const tl=gsap.timeline({paused:true});

// chapters (sequential in/out, one per track)
function chap(sel,t){

  tl.fromTo(sel,{autoAlpha:1},{autoAlpha:0,duration:0.5,ease:"power1.in"},t+2.0);
}
