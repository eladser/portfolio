<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
const root=document.getElementById('root');
const $=s=>root.querySelector(s);
const all=s=>root.querySelectorAll(s);

function inout(el){
  const s=parseFloat(el.dataset.start), d=parseFloat(el.dataset.duration);
  const fade=Math.min(0.6, d/3);
  tl.fromTo(el,{opacity:0,y:24},{opacity:1,y:0,duration:fade,ease:'power2.out'},s);
  tl.to(el,{opacity:0,y:-16,duration:0.45,ease:'power2.in'},s+d-0.45);
}

// generic in/out for most clips, with a few custom motions handled after
all('.clip').forEach(inout);

// scene 6 — slide chips toward the otel node (override the default y on top of fade)
tl.fromTo($('.ln1'),{x:-120},{x:120,duration:3.4,ease:'power2.inOut'},38);
tl.fromTo($('.ln2'),{x:0},{x:0,duration:3.4,ease:'none'},38);
tl.fromTo($('.ln3'),{x:120},{x:-120,duration:3.4,ease:'power2.inOut'},38);
tl.fromTo($('.otel'),{scale:0.92},{scale:1,duration:0.7,ease:'back.out(1.6)'},38.8);

// scene 3 — live $ spent counter
const spent=$('#spent');
const o={v:0};
tl.fromTo(o,{v:0},{v:0.042,duration:9,ease:'power1.out',
  onUpdate:()=>{spent.textContent='$'+o.v.toFixed(3);}},11);

window.__timelines["seerlens"]=tl;
</script>
